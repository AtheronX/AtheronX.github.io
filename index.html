        --border: rgba(255, 255, 255, 0.08);
        --text: #f0f4f8;
        --muted: #8b9bb4;
        --yellow: #f5c518;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Outfit', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .font-display {
        font-family: 'Fraunces', serif;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes pop {
        0% { transform: scale(0.96); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes confettiFall {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
      }

      .anim-slide-up {
        animation: slideUp 0.4s ease-out forwards;
      }

      .anim-pop {
        animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      @media (max-width: 768px) {
        .quiz-grid {
          grid-template-columns: 1fr !important;
        }
        .options-grid {
          grid-template-columns: 1fr !important;
        }
        .quiz-sidebar {
          order: -1;
        }
      }
    </style>
  </head>

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function buildPool() {
        const pool = {};
        for (const cat of CATS) {
          pool[cat] = shuffle(ALL_QUESTIONS.filter(q => q.category === cat)).slice(0, QUESTIONS_PER_CAT);
        }
        return pool;
      }

      function Confetti() {
        const colors = ['#F5C518', '#FF6B6B', '#00C9D4', '#9B5DE5', '#22D97A', '#fff'];
        return (
          <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 100 }}>
            {Array.from({ length: 50 }).map((_, i) => (
              <div key={i} style={{
                position: 'absolute',
                left: `${Math.random() * 100}%`,
                top: '-20px',
                width: `${6 + Math.random() * 8}px`,
                height: `${6 + Math.random() * 8}px`,
                borderRadius: Math.random() > 0.5 ? '50%' : '2px',
                background: colors[Math.floor(Math.random() * colors.length)],
                animation: `confettiFall ${2 + Math.random() * 3}s ${Math.random() * 2}s linear forwards`,
              }} />
            ))}
          </div>
        );
      }

          { name: 'Team Beta',  color: TEAM_COLORS[1], score: 0 },
        ]);

        const addTeam = () => {
          if (teams.length >= 4) return;
          setTeams(prev => [...prev, { name: `Team ${['Alpha','Beta','Gamma','Delta'][prev.length]}`, color: TEAM_COLORS[prev.length], score: 0 }]);

        return (
          <div style={{ minHeight: '100vh', background: 'var(--bg)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '24px' }}>

              <h1 className="font-display" style={{ fontSize: 'clamp(38px, 6vw, 72px)', fontWeight: 900, margin: 0, lineHeight: 1, color: 'var(--yellow)', letterSpacing: '-2px' }}>
                English Quiz
              </h1>
              <p style={{ marginTop: '10px', color: 'var(--muted)', fontSize: '17px', fontWeight: 500 }}>
                Pick your theme each round · A2 – B1 level
              </p>
            </div>

            <div style={{ display: 'flex', gap: '10px', marginBottom: '40px', flexWrap: 'wrap', justifyContent: 'center' }}>
              {CATS.map(cat => {

                    {m.emoji} {m.label}
                  </div>
                );
              })}
            </div>

            <div style={{ width: '100%', maxWidth: '500px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '18px' }}>

                <button onClick={addTeam} disabled={teams.length >= 4} style={{ padding: '8px 18px', borderRadius: '99px', border: 'none', background: teams.length >= 4 ? 'var(--card)' : 'var(--card2)', color: teams.length >= 4 ? 'var(--muted)' : 'var(--text)', fontSize: '14px', fontWeight: 600, cursor: teams.length >= 4 ? 'not-allowed' : 'pointer' }}>
                  + Add Team
                </button>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>

                    <input
                      value={team.name}
                      onChange={e => setTeams(prev => prev.map((t, idx) => idx === i ? { ...t, name: e.target.value } : t))}
                      maxLength={20}
                      style={{ flex: 1, background: 'transparent', border: 'none', outline: 'none', fontSize: '17px', fontWeight: 700, color: 'var(--text)', fontFamily: 'Outfit, sans-serif' }}

                <div style={{ display: 'flex', gap: '12px' }}>
                  {teams.map((t, i) => (
                    <div key={i} style={{ display: 'flex', alignItems: 'center', gap: '6px', padding: '4px 12px', borderRadius: '99px', background: i === teamIndex ? `${t.color}22` : 'var(--card)', border: `1.5px solid ${i === teamIndex ? t.color + '88' : 'transparent'}` }}>
                      <div style={{ width: '8px', height: '8px', borderRadius: '50%', background: t.color }} />
                      <span style={{ fontSize: '13px', fontWeight: 700, color: i === teamIndex ? t.color : 'var(--muted)' }}>{t.score}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{ height: '4px', background: 'var(--card)', borderRadius: '2px' }}>
                <div style={{ height: '100%', borderRadius: '2px', background: team.color, width: `${(answeredCount / totalQuestions) * 100}%`, transition: 'width 0.5s' }} />
              </div>
            </div>

            <div style={{ textAlign: 'center', marginBottom: '36px' }} className="anim-pop">
              <div style={{ width: '52px', height: '52px', borderRadius: '50%', background: team.color, margin: '0 auto 14px', boxShadow: `0 0 24px ${team.color}88`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '22px' }}>
                {['🅐','🅑','🅒','🅓'][teamIndex]}
              </div>
              <h2 className="font-display" style={{ margin: 0, fontSize: 'clamp(22px, 4vw, 36px)', fontWeight: 900, color: team.color, letterSpacing: '-1px' }}>
                {team.name}
              </h2>
              <p style={{ marginTop: '8px', color: 'var(--muted)', fontSize: '16px' }}>Pick a theme for your question!</p>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '16px', width: '100%', maxWidth: '640px' }}>
              {CATS.map(cat => {
                const m = CAT_META[cat];
                const remaining = pool[cat].length;
                const empty = remaining === 0;

                return (
                  <button
                    key={cat}
                    onClick={() => !empty && onPick(cat)}
                    disabled={empty}
                    className={empty ? '' : 'anim-pop'}
                    style={{
                      padding: '28px 24px',
                      borderRadius: '20px',
                      border: `2px solid ${empty ? 'var(--border)' : m.color + '66'}`,
                      background: empty ? 'var(--card)' : `${m.color}14`,
                      cursor: empty ? 'not-allowed' : 'pointer',
                      textAlign: 'left',
                      transition: 'all 0.2s',
                      opacity: empty ? 0.4 : 1,
                      position: 'relative',
                      overflow: 'hidden',
                    }}
                    onMouseEnter={e => { if (!empty) { e.currentTarget.style.background = `${m.color}28`; e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.boxShadow = `0 8px 32px ${m.color}33`; } }}
                    onMouseLeave={e => { if (!empty) { e.currentTarget.style.background = `${m.color}14`; e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = 'none'; } }}
                  >
                    <div style={{ position: 'absolute', right: '16px', bottom: '10px', fontSize: '52px', opacity: 0.12, userSelect: 'none' }}>{m.emoji}</div>
                    <div style={{ fontSize: '30px', marginBottom: '10px' }}>{m.emoji}</div>
                    <div className="font-display" style={{ fontSize: '22px', fontWeight: 800, color: empty ? 'var(--muted)' : m.color, marginBottom: '4px', letterSpacing: '-0.5px' }}>
                      {m.label}
                    </div>
                    <div style={{ fontSize: '13px', color: 'var(--muted)', marginBottom: '14px' }}>{m.desc}</div>
                    <div style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', padding: '4px 12px', borderRadius: '99px', background: empty ? 'var(--card2)' : `${m.color}22`, border: `1px solid ${empty ? 'transparent' : m.color + '44'}` }}>
                      <span style={{ fontSize: '12px', fontWeight: 700, color: empty ? 'var(--muted)' : m.color }}>
                        {empty ? 'Used up!' : `${remaining} question${remaining !== 1 ? 's' : ''} left`}
                      </span>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      }

      function AnswerBtn({ label, index, letter, selectedAnswer, correctAnswer, disabled, onClick }) {
        const isSelected = selectedAnswer === index;
        const isCorrect = correctAnswer === index;
        const revealed = selectedAnswer !== null;

        let bg = 'var(--card)', border = 'rgba(255,255,255,0.08)', color = 'var(--text)', animClass = '', icon = '';
        if (revealed) {
          if (isCorrect)       { bg = 'rgba(34,217,122,0.15)'; border = '#22D97A'; color = '#22D97A'; icon = '✓'; }
          else if (isSelected) { bg = 'rgba(255,71,87,0.15)';  border = '#FF4757'; color = '#FF4757'; icon = '✗'; }
          else                 { color = 'var(--muted)'; }
        }

        return (
          <button onClick={onClick} disabled={disabled} className={animClass} style={{ display: 'flex', alignItems: 'center', gap: '14px', padding: '16px 20px', borderRadius: '14px', width: '100%', textAlign: 'left', background: bg, border: `1.5px solid ${border}`, color, fontSize: '16px', fontWeight: 600, fontFamily: 'Outfit, sans-serif', cursor: disabled ? 'default' : 'pointer', transition: 'all 0.2s' }}
            onMouseEnter={e => { if (!disabled) e.currentTarget.style.background = 'var(--card2)'; }}
            onMouseLeave={e => { if (!disabled) e.currentTarget.style.background = bg; }}
          >
            <span style={{ width: '30px', height: '30px', borderRadius: '8px', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: revealed ? 'transparent' : 'var(--card2)', border: revealed ? '1.5px solid currentColor' : '1px solid rgba(255,255,255,0.1)', fontSize: '13px', fontWeight: 800, fontFamily: 'Fraunces, serif' }}>
              {letter}
            </span>
            <span style={{ flex: 1 }}>{label}</span>
            {icon && <span style={{ fontSize: '18px', fontWeight: 900 }}>{icon}</span>}
          </button>
        );
      }

      function QuizScreen({ teams, teamIndex, question, questionNumber, totalQuestions, timeLeft, selectedAnswer, onAnswer }) {
        const m = CAT_META[question.category];
        const team = teams[teamIndex];
        const timerPct = (timeLeft / TIME_PER_QUESTION) * 100;
        const timerColor = timeLeft > 10 ? '#22D97A' : timeLeft > 5 ? '#F5C518' : '#FF4757';

        return (
          <div style={{ minHeight: '100vh', background: 'var(--bg)', display: 'grid', gridTemplateColumns: '1fr 260px', maxWidth: '1100px', margin: '0 auto', padding: '24px', gap: '24px' }} className="quiz-grid">
            <div style={{ display: 'flex', flexDirection: 'column', gap: '18px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span style={{ padding: '6px 14px', borderRadius: '99px', background: `${m.color}20`, color: m.color, fontSize: '14px', fontWeight: 700, border: `1px solid ${m.color}44` }}>
                  {m.emoji} {m.label}
                </span>
                <span style={{ color: 'var(--muted)', fontSize: '14px', fontWeight: 600 }}>Q {questionNumber} / {totalQuestions}</span>
              </div>

              <div style={{ height: '4px', background: 'var(--card)', borderRadius: '2px' }}>
                <div style={{ height: '100%', borderRadius: '2px', background: m.color, width: `${(questionNumber / totalQuestions) * 100}%`, transition: 'width 0.4s' }} />
              </div>

              <div style={{ padding: '12px 18px', borderRadius: '12px', background: `${team.color}18`, border: `1.5px solid ${team.color}55`, display: 'flex', alignItems: 'center', gap: '10px' }}>
                <div style={{ width: '10px', height: '10px', borderRadius: '50%', background: team.color, boxShadow: `0 0 8px ${team.color}` }} />
                <span style={{ fontWeight: 700, color: team.color, fontSize: '15px' }}>{team.name}'s turn</span>
                <span style={{ marginLeft: 'auto', color: 'var(--muted)', fontSize: '13px' }}>Score: <b style={{ color: team.color }}>{team.score}</b></span>
              </div>

              <div>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                  <span style={{ color: 'var(--muted)', fontSize: '12px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '1px' }}>Time</span>
                  <span style={{ fontWeight: 900, fontSize: '20px', color: timerColor, fontFamily: 'Fraunces, serif', transition: 'color 0.3s' }}>{timeLeft}s</span>
                </div>
                <div style={{ height: '8px', background: 'var(--card)', borderRadius: '4px', overflow: 'hidden' }}>
                  <div style={{ height: '100%', borderRadius: '4px', background: timerColor, width: `${timerPct}%`, transition: 'width 1s linear, background 0.3s', boxShadow: `0 0 10px ${timerColor}88` }} />
                </div>
              </div>

              <div key={question.id} className="anim-pop" style={{ padding: '30px', borderRadius: '20px', background: 'var(--card)', border: '1px solid var(--border)', minHeight: '130px', display: 'flex', alignItems: 'center' }}>
                <p className="font-display" style={{ margin: 0, fontSize: 'clamp(19px, 2.5vw, 26px)', fontWeight: 700, lineHeight: 1.35, color: 'var(--text)' }}>
                  {question.question}
                </p>
              </div>

              <div key={`opts-${question.id}`} className="options-grid" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                {question.options.map((opt, i) => (
                  <AnswerBtn key={i} index={i} letter={['A','B','C','D'][i]} label={opt}
                    selectedAnswer={selectedAnswer} correctAnswer={question.correct}
                    disabled={selectedAnswer !== null} onClick={() => onAnswer(i)} />
                ))}
              </div>
            </div>

            <div className="quiz-sidebar" style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
              <h3 style={{ margin: 0, fontSize: '13px', fontWeight: 700, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '1px' }}>🏆 Scores</h3>
              {[...teams].map((t, i) => ({ ...t, origIdx: i })).sort((a, b) => b.score - a.score).map((t, rank) => (
                <div key={t.origIdx} style={{ padding: '12px 14px', borderRadius: '12px', background: t.origIdx === teamIndex ? `${t.color}18` : 'var(--card)', border: `1.5px solid ${t.origIdx === teamIndex ? t.color + '66' : 'var(--border)'}`, display: 'flex', alignItems: 'center', gap: '10px', transition: 'all 0.3s' }}>
                  <span style={{ fontSize: '14px' }}>{['🥇','🥈','🥉','4️⃣'][rank]}</span>
                  <div style={{ width: '9px', height: '9px', borderRadius: '50%', background: t.color, flexShrink: 0 }} />
                  <span style={{ flex: 1, fontSize: '13px', fontWeight: 700, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{t.name}</span>
                  <span className="font-display" style={{ fontSize: '22px', fontWeight: 900, color: t.color }}>{t.score}</span>
                </div>
              ))}

              <div style={{ marginTop: '8px', padding: '14px', borderRadius: '12px', background: 'var(--card)', border: '1px solid var(--border)' }}>
                <div style={{ fontSize: '11px', fontWeight: 700, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '10px' }}>Themes</div>
                {CATS.map(cat => {
                  const cm = CAT_META[cat];
                  return (
                    <div key={cat} style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px' }}>
                      <span style={{ fontSize: '13px' }}>{cm.emoji}</span>
                      <span style={{ fontSize: '12px', color: cm.color, fontWeight: 600, flex: 1 }}>{cm.label}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      }

      function ResultsScreen({ teams, totalQuestions, onPlayAgain }) {
        const sorted = [...teams].sort((a, b) => b.score - a.score);
        const winner = sorted[0];
        const isTie = sorted.length > 1 && sorted[0].score === sorted[1].score;

        return (
          <div style={{ minHeight: '100vh', background: 'var(--bg)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '24px' }}>
            <Confetti />
            <div style={{ textAlign: 'center', marginBottom: '36px' }} className="anim-pop">
              <div style={{ fontSize: '68px', marginBottom: '10px' }}>{isTie ? '🤝' : '🏆'}</div>
              <h1 className="font-display" style={{ fontSize: 'clamp(30px, 5vw, 58px)', fontWeight: 900, margin: 0, lineHeight: 1, color: 'var(--yellow)', letterSpacing: '-2px' }}>
                {isTie ? 'It\'s a Tie!' : `${winner.name} Wins!`}
              </h1>
              <p style={{ marginTop: '10px', color: 'var(--muted)', fontSize: '16px' }}>
                {isTie ? 'Two teams at the top — incredible!' : `Congratulations to ${winner.name}! 🎉`}
              </p>
            </div>

            <div style={{ width: '100%', maxWidth: '480px', display: 'flex', flexDirection: 'column', gap: '10px', marginBottom: '36px' }}>
              {sorted.map((team, rank) => (
                <div key={team.name} className="anim-slide-up" style={{ padding: '18px 22px', borderRadius: '16px', background: rank === 0 ? `${team.color}20` : 'var(--card)', border: `2px solid ${rank === 0 ? team.color : 'var(--border)'}`, display: 'flex', alignItems: 'center', gap: '14px', animationDelay: `${rank * 0.1}s`, boxShadow: rank === 0 ? `0 0 36px ${team.color}33` : 'none' }}>
                  <span style={{ fontSize: '26px' }}>{['🥇','🥈','🥉','4️⃣'][rank]}</span>
                  <div style={{ width: '12px', height: '12px', borderRadius: '50%', background: team.color, boxShadow: `0 0 10px ${team.color}` }} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: '18px', fontWeight: 700, color: rank === 0 ? team.color : 'var(--text)' }}>{team.name}</div>
                    <div style={{ fontSize: '12px', color: 'var(--muted)' }}>{Math.round((team.score / (totalQuestions * 10)) * 100)}% accuracy</div>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <div className="font-display" style={{ fontSize: '30px', fontWeight: 900, color: rank === 0 ? team.color : 'var(--text)' }}>{team.score}</div>
                    <div style={{ fontSize: '11px', color: 'var(--muted)' }}>pts</div>
                  </div>
                </div>
              ))}
            </div>

            <button onClick={onPlayAgain} style={{ padding: '16px 44px', borderRadius: '14px', border: 'none', background: 'var(--yellow)', color: '#0D1B2A', fontSize: '17px', fontWeight: 800, cursor: 'pointer', fontFamily: 'Fraunces, serif', boxShadow: '0 0 30px rgba(245,197,24,0.4)', transition: 'transform 0.2s' }}
              onMouseEnter={e => (e.currentTarget.style.transform = 'translateY(-3px)')}
              onMouseLeave={e => (e.currentTarget.style.transform = 'translateY(0)')}>
              🔄 Play Again
            </button>
          </div>
        );
      }

      function App() {
        const [screen, setScreen] = useState('setup');
        const [teams, setTeams] = useState([]);
        const [pool, setPool] = useState({});
        const [teamIndex, setTeamIndex] = useState(0);
        const [currentQuestion, setCurrentQuestion] = useState(null);
        const [answeredCount, setAnsweredCount] = useState(0);
        const [timeLeft, setTimeLeft] = useState(TIME_PER_QUESTION);
        const [selectedAnswer, setSelectedAnswer] = useState(null);

        const totalQuestions = QUESTIONS_PER_CAT * CATS.length;
        const handleAnswerRef = useRef(() => {});

        const handleAnswer = useCallback((answerIndex) => {
          if (selectedAnswer !== null) return;
          setSelectedAnswer(answerIndex);

          const correct = currentQuestion !== null && answerIndex === currentQuestion.correct;
          if (correct) {
            setTeams(prev => prev.map((t, i) => i === teamIndex ? { ...t, score: t.score + 10 } : t));
          }

          const nextAnswered = answeredCount + 1;
          setTimeout(() => {
            if (nextAnswered >= totalQuestions) {
              setScreen('results');
            } else {
              setAnsweredCount(nextAnswered);
              setTeamIndex(prev => (prev + 1) % teams.length);
              setCurrentQuestion(null);
              setSelectedAnswer(null);
              setTimeLeft(TIME_PER_QUESTION);
              setScreen('category');
            }
          }, 1800);
        }, [selectedAnswer, currentQuestion, answeredCount, teamIndex, teams.length, totalQuestions]);

        handleAnswerRef.current = handleAnswer;

        useEffect(() => {
          if (screen !== 'quiz' || selectedAnswer !== null) return;
          const interval = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) { clearInterval(interval); handleAnswerRef.current(-1); return 0; }
              return prev - 1;
            });
          }, 1000);
          return () => clearInterval(interval);
        }, [screen, currentQuestion, selectedAnswer]);

        const startGame = (newTeams) => {
          setTeams(newTeams.map(t => ({ ...t, score: 0 })));
          setPool(buildPool());
          setTeamIndex(0);
          setAnsweredCount(0);
          setCurrentQuestion(null);
          setSelectedAnswer(null);
          setTimeLeft(TIME_PER_QUESTION);
          setScreen('category');
        };

        const pickCategory = (cat) => {
          const remaining = pool[cat];
          if (!remaining.length) return;
          const [question, ...rest] = remaining;
          setPool(prev => ({ ...prev, [cat]: rest }));
          setCurrentQuestion(question);
          setSelectedAnswer(null);
          setTimeLeft(TIME_PER_QUESTION);
          setScreen('quiz');
        };

        if (screen === 'setup')    return <SetupScreen onStart={startGame} />;
        if (screen === 'category') return <CategoryPicker pool={pool} teams={teams} teamIndex={teamIndex} answeredCount={answeredCount} totalQuestions={totalQuestions} onPick={pickCategory} />;
        if (screen === 'quiz' && currentQuestion) return <QuizScreen teams={teams} teamIndex={teamIndex} question={currentQuestion} questionNumber={answeredCount + 1} totalQuestions={totalQuestions} timeLeft={timeLeft} selectedAnswer={selectedAnswer} onAnswer={handleAnswer} />;
        if (screen === 'results')  return <ResultsScreen teams={teams} totalQuestions={totalQuestions} onPlayAgain={() => setScreen('setup')} />;
        return null;
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
